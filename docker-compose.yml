services:
  stadium:
    build: ./backend
    container_name: energy-smart-stadium
    restart: unless-stopped
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
